<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="grad16" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#DB2777" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="800" height="1000" fill="url(#grad16)"/>
  <circle cx="400" cy="420" r="220" fill="#ffffff" opacity="0.25" />
  <circle cx="400" cy="420" r="180" fill="#ffffff" opacity="0.4" />
  <!-- Cute Birthday Mascot Placeholder Icon -->
  <g transform="translate(400, 390) scale(1.5)" filter="url(#shadow)">
    <!-- Birthday Hat -->
    <path d="M-30,-20 L0,-90 L30,-20 Z" fill="#FF5722" />
    <circle cx="0" cy="-95" r="10" fill="#FFEB3B" />
    <!-- Balloon / Face -->
    <circle cx="0" cy="30" r="60" fill="#FFF9C4" />
    <!-- Happy eyes -->
    <path d="M-25,20 Q-15,5 -5,20" stroke="#37474F" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M5,20 Q15,5 25,20" stroke="#37474F" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- Rosy cheeks -->
    <circle cx="-30" cy="32" r="8" fill="#FF8A80" opacity="0.6"/>
    <circle cx="30" cy="32" r="8" fill="#FF8A80" opacity="0.6"/>
    <!-- Big smile -->
    <path d="M-15,40 Q0,58 15,40" stroke="#37474F" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- Number 2 badge -->
    <circle cx="45" cy="-10" r="22" fill="#E91E63"/>
    <text x="45" y="-2" font-family="sans-serif" font-weight="bold" font-size="24" fill="#FFFFFF" text-anchor="middle">2</text>
  </g>
  <rect x="60" y="700" width="680" height="200" rx="24" fill="#FFFFFF" opacity="0.92" filter="url(#shadow)"/>
  <text x="400" y="770" font-family="system-ui, sans-serif" font-weight="800" font-size="42" fill="#1E293B" text-anchor="middle">Reyansh's Rainbow</text>
  <text x="400" y="825" font-family="system-ui, sans-serif" font-weight="600" font-size="24" fill="#64748B" text-anchor="middle">Reyansh Sharma &bull; 4 Oct 2026</text>
  <text x="400" y="865" font-family="system-ui, sans-serif" font-weight="500" font-size="18" fill="#94A3B8" text-anchor="middle">(Add your real photo to /public folder)</text>
</svg>